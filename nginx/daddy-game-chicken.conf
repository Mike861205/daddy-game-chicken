# Nginx configuration for Daddy Game Chicken.
# The game is served at the main domain and the owner panel at /superadmin/.

server {
    listen 80;
    listen [::]:80;
    server_name daddygame.systemdem.online;

    root /var/www/daddy-game-chicken/game/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }

    location = /superadmin {
        return 301 /superadmin/;
    }

    location ^~ /superadmin/ {
        root /var/www/daddy-game-chicken/admin/dist;
        try_files $uri $uri/ /superadmin/index.html;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
    }

    # The browser must revalidate the service worker so PWA updates arrive
    # promptly instead of remaining behind the immutable JavaScript cache.
    location = /sw.js {
        try_files $uri =404;
        default_type application/javascript;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }

    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|mp3|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
