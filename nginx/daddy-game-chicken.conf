# Nginx configuration for Daddy Game Chicken
# Serves the compiled game and proxies /api to the Node.js API on port 3005.
#
# Place this file at: /etc/nginx/sites-available/daddy-game-chicken.conf
# Then: sudo ln -s /etc/nginx/sites-available/daddy-game-chicken.conf /etc/nginx/sites-enabled/
#
# Replace juego.daddypollo.com with your real domain before enabling.

# Gzip compression for static assets.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
  text/plain
  text/css
  text/javascript
  application/javascript
  application/json
  image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name juego.daddypollo.com;

    # Certbot will manage the HTTPS server block and redirect below.
    # Root of the compiled frontend.
    root /var/www/daddy-game-chicken/game/dist;
    index index.html;

    # Basic security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Limit request body size (API accepts small JSON payloads).
    client_max_body_size 1m;

    # API proxy: forward /api to the Node.js backend.
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Do not cache API responses.
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 30s;
    }

    # Cache static assets (images, audio, JS, CSS) aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|mp3|ogg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA-style fallback: serve index.html for unknown routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
