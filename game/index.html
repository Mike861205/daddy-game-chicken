<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a2a6c" />
    <title>Daddy Game Chicken: Atrapa el Sabor</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <div id="game-root">
      <div id="loading-screen" role="status" aria-label="Cargando Daddy Game Chicken">
        <div class="matrix-rain" aria-hidden="true">
          <span>DADDY01</span><span>POLLO10</span><span>100101</span><span>FUEGO</span>
          <span>COMBO</span><span>010011</span><span>SABOR</span><span>ARMA01</span>
          <span>110010</span><span>DADDY</span><span>PREMIO</span><span>001101</span>
          <span>CHICKEN</span><span>NEON10</span><span>101100</span><span>POWER</span>
        </div>

        <div class="intro-orbit intro-orbit--one" aria-hidden="true"></div>
        <div class="intro-orbit intro-orbit--two" aria-hidden="true"></div>

        <img
          class="loading-brand"
          src="/assets/images/logo-daddy-game-chicken.png"
          alt="Daddy Pollo"
        />
        <div class="loading-kicker">ATRAPA EL SABOR</div>
        <h1 class="loading-title" data-text="DADDY GAME CHICKEN">DADDY GAME CHICKEN</h1>
        <p class="loading-subtitle">PREPARANDO LA MISIÓN</p>

        <div class="intro-stage" aria-hidden="true">
          <div class="speed-line speed-line--one"></div>
          <div class="speed-line speed-line--two"></div>
          <div class="speed-line speed-line--three"></div>
          <div class="intro-boss-portal is-right" data-power="fire">
            <div class="boss-warning-ring"></div>
            <img class="intro-boss is-active" data-world-index="0" data-boss-power="fire" data-boss-name="REY BRASAS" src="/assets/images/jefe-mundo-1.png" alt="" />
            <img class="intro-boss" data-world-index="1" data-boss-power="cannon" data-boss-name="ALMIRANTE PICO NEGRO" src="/assets/images/jefe-mundo-2.png" alt="" />
            <img class="intro-boss" data-world-index="2" data-boss-power="abyss" data-boss-name="LEVIATÁN POSEIDÓN" src="/assets/images/jefe-mundo-3.png" alt="" />
            <img class="intro-boss" data-world-index="3" data-boss-power="toxic" data-boss-name="DOCTOR RADIACTIVO" src="/assets/images/jefe-mundo-4.png" alt="" />
            <img class="intro-boss" data-world-index="4" data-boss-power="void" data-boss-name="EMPERADOR OMEGA" src="/assets/images/jefe-mundo-5.png" alt="" />
            <img class="intro-boss intro-boss--twin intro-boss--fire" data-world-index="5" data-boss-power="dual" data-boss-name="GEMELOS DEL ECLIPSE" src="/assets/images/jefe-mundo-6-fuego.png" alt="" />
            <img class="intro-boss intro-boss--twin intro-boss--ice" data-world-index="5" data-boss-power="dual" data-boss-name="GEMELOS DEL ECLIPSE" src="/assets/images/jefe-mundo-6-hielo.png" alt="" />
            <img class="intro-boss intro-boss--aircraft" data-world-index="6" data-boss-power="atomic" data-boss-name="BOMBARDERO ARMAGEDÓN" src="/assets/images/jefe-mundo-7.png" alt="" />
            <img class="intro-boss intro-boss--carrier" data-world-index="7" data-boss-power="alien" data-boss-name="NAVE MADRE XAL-9" src="/assets/images/jefe-mundo-8.png" alt="" />
            <div class="boss-power-stream">
              <i class="boss-power boss-power--one"></i>
              <i class="boss-power boss-power--two"></i>
              <i class="boss-power boss-power--three"></i>
              <i class="boss-power boss-power--four"></i>
            </div>
            <div class="intro-boss-label"><small>OBJETIVO DETECTADO</small><strong>REY BRASAS</strong></div>
          </div>
          <div class="intro-runner is-bike-phase">
            <div class="runner-bike" aria-hidden="true">
              <div class="runner-bike-sprite"></div>
              <i class="runner-bike-wheel runner-bike-wheel--rear"></i>
              <i class="runner-bike-wheel runner-bike-wheel--front"></i>
              <img
                class="runner-bike-logo"
                src="/assets/images/logo-daddy-game-chicken.png"
                alt=""
              />
            </div>
            <div class="runner-sprite"></div>
            <i class="intro-shot intro-shot--one"></i>
            <i class="intro-shot intro-shot--two"></i>
            <i class="intro-shot intro-shot--three"></i>
          </div>
          <div class="intro-explosion intro-explosion--one"><i></i><b>BOOM!</b></div>
          <div class="intro-explosion intro-explosion--two"><i></i></div>
        </div>

        <img class="floating-icon floating-icon--fries" src="/assets/images/papas-con-pollo.png" alt="" />
        <img class="floating-icon floating-icon--burger" src="/assets/images/hamburguesa-bbq.png" alt="" />
        <img class="floating-icon floating-icon--trident" src="/assets/images/tridente-poseidon.png" alt="" />
        <img class="floating-icon floating-icon--combo" src="/assets/images/combo-daddy.png" alt="" />

        <div class="loading-progress-wrap">
          <div class="loading-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <span></span><i></i>
          </div>
          <div class="loading-meta">
            <span class="loading-text">ENERGIZANDO EL JUEGO</span>
            <b class="loading-percent">0%</b>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
